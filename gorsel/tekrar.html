<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:19px;line-height:1.6}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
header .logo i{font-size:26px;color:var(--accent)}
header .sp{flex:1}
.btn{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--soft)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme=dark] .btn.main{color:#13201A}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 62px)}
nav{border-right:1px solid var(--line);padding:18px 12px;overflow:auto}
nav .lv{width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
nav .lv:hover{background:var(--line)}
nav .lv.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
nav .lv .k{font-family:"JetBrains Mono",monospace;width:26px;height:26px;border-radius:7px;border:1px solid currentColor;display:grid;place-items:center;font-size:14px;flex:none}
main{padding:22px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-content:start}
.crumb{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.crumb small{color:var(--soft);font-size:15px}
.crumb h1{margin:0;font-size:30px;line-height:1.25;width:100%}
.tag{font-size:14px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;justify-content:center;min-height:380px;position:relative;overflow:hidden}
.stage .grid{position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;opacity:.7}
.scene{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.node{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:20px 14px;text-align:center;transition:all .45s}
.node i{font-size:54px;display:block;margin-bottom:8px}
.node b{display:block;font-size:17px;line-height:1.3}
.node span{font-size:14px;color:var(--soft)}
.node.claude i{color:var(--accent)}
.node.world i{color:var(--warm-ink)}
.node.dim{opacity:.3;filter:grayscale(1)}
.node.lit{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-bg)}
.node.world.lit{border-color:var(--warm-ink);box-shadow:0 0 0 4px var(--warm)}
.link{font-size:36px;color:var(--soft);transition:all .45s}
.link.lit{color:var(--accent);transform:scale(1.2)}
.scene-hd{position:relative;font-size:14px;letter-spacing:.06em;color:var(--soft);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.scene-hd i{font-size:18px}
.flow{position:relative;display:grid;grid-template-columns:1fr 70px 1fr 70px 1fr;align-items:center}
.fn{background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:18px 8px;text-align:center;opacity:0;transform:translateY(14px) scale(.9);animation:pop .5s forwards}
.fn i{font-size:46px;display:block;margin-bottom:6px}
.fn b{font-size:16px;line-height:1.25;display:block}
.c .fn{border-color:var(--accent)}.c .fn i{color:var(--accent)}
.w .fn{border-color:var(--warm-ink);background:var(--warm)}.w .fn i{color:var(--warm-ink)}.w .fn b{color:var(--warm-ink)}
.fl{position:relative;height:4px;margin:0 6px;background:var(--line);border-radius:2px;overflow:visible;opacity:0;animation:fade .3s forwards}
.fl::after{content:"";position:absolute;top:-6px;left:0;width:16px;height:16px;border-radius:50%;background:var(--accent);animation:pkt 1.6s ease-in-out infinite;animation-delay:inherit}
.w .fl::after{background:var(--warm-ink)}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes pkt{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 16px);opacity:0}}
.swap{animation:swap .5s}
@keyframes swap{from{opacity:0;transform:rotateY(70deg)}to{opacity:1;transform:none}}
@media(max-width:900px){.flow{grid-template-columns:1fr;gap:6px}.fl{width:4px;height:34px;margin:0 auto}.fl::after{left:-6px;animation-name:pktv}@keyframes pktv{0%{top:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:calc(100% - 16px);opacity:0}}.fn i{font-size:36px}}

.legend i{vertical-align:-3px}
.side{display:flex;flex-direction:column;gap:16px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
.step .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft);margin-bottom:6px}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--warm);color:var(--warm-ink);font-weight:600}
.step h2{margin:4px 0 10px;font-size:24px;line-height:1.3}
.step p{margin:0 0 12px}
.idea{background:var(--idea);color:var(--idea-ink);border-radius:12px;padding:14px 16px;display:flex;gap:12px;margin-top:6px}
.idea i{font-size:26px}
.idea small{display:block;font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.05em;opacity:.8}
.ctrl{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.dots{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 20px}
.dots .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.dot{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--soft);font-family:"JetBrains Mono",monospace;font-size:13px;cursor:pointer}
.dot.done{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.dot.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
:root[data-theme=dark] .dot.on{color:#13201A}
.hint{font-size:14px;color:var(--soft);text-align:center;margin-top:8px}
kbd{font-family:"JetBrains Mono",monospace;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--bg)}
@media(max-width:900px){.wrap{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}nav .lv{width:auto;white-space:nowrap}nav .lv .t{display:none}main{grid-template-columns:1fr;padding:16px}.stage{min-height:300px;padding:18px}.node i{font-size:40px}}
</style>
</head>

function flow(spec,cls){const p=spec.split('|');let h='';p.forEach((x,i)=>{const[ic,lb]=x.split(':');h+='<div class="fn" style="animation-delay:'+(i*0.7)+'s"><i class="ti ti-'+ic+'"></i><b>'+lb+'</b></div>';if(i<p.length-1)h+='<div class="fl" style="animation-delay:'+(i*0.7+0.4)+'s"></div>'});return '<div class="'+cls+'" style="display:contents">'+h+'</div>'}
let L=0,S=0,P=0;
const $=id=>document.getElementById(id);
const nav=$('nav');
D.forEach((lv,i)=>{const b=document.createElement('button');b.className='lv';b.innerHTML='<span class="k">'+(i+1)+'</span><span class="t">'+lv[0]+'</span>';b.onclick=()=>{L=i;S=0;P=0;draw()};nav.appendChild(b)});
function draw(){
  const lv=D[L],l=lv[2][S];
  [...nav.children].forEach((b,i)=>b.classList.toggle('on',i===L));
  $('where').textContent='SEVİYE '+(L+1)+' · '+lv[0].toUpperCase()+' / DERS '+(S+1)+' / '+lv[2].length;
  $('cnt').textContent=l[0];
  $('title').textContent=l[1];
  $('lsum').textContent=lv[1];
  const f=F[l[0]],fl=$('flow');
  $('shd').innerHTML=P===0?'<i class="ti ti-robot" style="color:var(--accent)"></i> CLAUDE DÜNYASINDA':'<i class="ti ti-building-factory" style="color:var(--warm-ink)"></i> SENİN DÜNYANDA';
  fl.innerHTML=flow(f[P],P===0?'c':'w');
  fl.classList.remove('swap');void fl.offsetWidth;if(P===1)fl.classList.add('swap');
  $('stepno').textContent='ADIM '+(P+1)+' / 2';
  $('pill').textContent=P===0?'KAVRAM':'BENZETME';
  $('sh').textContent=P===0?'Ne öğrendin?':'Bildiğin dünyada neye benzer?';
  $('sp').textContent=P===0?l[2]:'Bu kavramı aklında tutmanın yolu:';
  $('idea').style.display='flex';
  $('bz').textContent=l[3];
  const last=L===D.length-1&&S===lv[2].length-1&&P===1;
  $('fwd').innerHTML=last?'Bitti <i class="ti ti-check"></i>':(P===0?'Benzetmeyi göster':'Sonraki ders')+' <i class="ti ti-arrow-right"></i>';
  $('dots').innerHTML=lv[2].map((x,i)=>'<button class="dot '+(i===S?'on':i<S?'done':'')+'" data-i="'+i+'">'+x[0]+'</button>').join('');
  [...$('dots').children].forEach(d=>d.onclick=()=>{S=+d.dataset.i;P=0;draw()});
}
function fwd(){if(P===0){P=1}else if(S<D[L][2].length-1){S++;P=0}else if(L<D.length-1){L++;S=0;P=0}draw()}
function back(){if(P===1){P=0}else if(S>0){S--;P=1}else if(L>0){L--;S=D[L][2].length-1;P=1}draw()}
$('fwd').onclick=fwd;$('back').onclick=back;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')fwd();if(e.key==='ArrowLeft')back()});
$('theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark';$('theme').innerHTML='<i class="ti ti-'+(d?'moon':'sun')+'"></i>'};
if(matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.dataset.theme='dark';$('theme').innerHTML='<i class="ti ti-sun"></i>'}
draw();
</script>
