<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Ustalık · Görsel dersler</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#F3EEE3;--panel:#FBF8F1;--ink:#2B2620;--soft:#6B6358;--line:#DDD4C3;--ac:#3E7B5B;--ac-bg:#E2EEDF;--idea:#ECE6F6;--idea-ink:#4A3D7A;--warm:#F5E3CC;--warm-ink:#8A4E14;--pk2:#B8642A;color-scheme:light}
:root[data-theme=dark]{--bg:#1D1B18;--panel:#272420;--ink:#EFE8DB;--soft:#B3A999;--line:#3D3832;--ac:#7FC29B;--ac-bg:#26382D;--idea:#2E2840;--idea-ink:#CFC3F2;--warm:#3D2E1E;--warm-ink:#F0C08A;--pk2:#E79A5E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:19px;line-height:1.6}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo i{font-size:26px;color:var(--ac)}
.sp{flex:1}
.btn{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--soft)}
.btn.main{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
:root[data-theme=dark] .btn.main{color:#13201A}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr)}
nav{border-right:1px solid var(--line);padding:16px 10px;min-height:calc(100vh - 64px)}
nav .lv{width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:17px;padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
nav .lv:hover{background:var(--line)}
nav .lv.on{background:var(--ac-bg);color:var(--ac);font-weight:600}
nav .k{font-family:"JetBrains Mono",monospace;width:26px;height:26px;border-radius:7px;border:1px solid currentColor;display:grid;place-items:center;font-size:14px;flex:none}
main{padding:20px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-content:start}
.crumb{grid-column:1/-1}
.crumb small{color:var(--soft);font-size:15px}
.crumb h1{margin:2px 0 0;font-size:30px;line-height:1.25}
.crumb p{margin:4px 0 0;color:var(--soft)}
.left{display:flex;flex-direction:column;gap:14px;min-width:0}
.mets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.met{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.met small{display:block;font-size:13px;color:var(--soft);font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.04em}
.met b{font-size:21px;font-weight:600;display:block;transition:color .4s}
.met b.new{color:var(--ac);animation:bump .5s}
@keyframes bump{0%{transform:scale(1.25)}100%{transform:none}}
.stage{--hw:min(66px,11.5%);background:var(--panel);border:1px solid var(--line);border-radius:16px;position:relative;height:380px;overflow:hidden}
.stage .dg{position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;opacity:.7}
.shd{position:absolute;left:16px;top:12px;font-size:13px;letter-spacing:.06em;color:var(--soft);display:flex;gap:6px;align-items:center;z-index:2}
.shd i{font-size:17px}
svg.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg.ln line{stroke:var(--line);stroke-width:3;stroke-dasharray:6 6;transition:opacity .5s}
.nd{position:absolute;width:min(132px,23%);transform:translate(-50%,-50%) scale(.85);opacity:0;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;transition:all .5s;z-index:1}
.nd i{font-size:34px;display:block;color:var(--soft);transition:color .4s}
.nd b{font-size:15px;line-height:1.25;display:block;font-weight:500}
.nd.vis{opacity:.45;transform:translate(-50%,-50%)}
.nd.on{opacity:1;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac-bg)}
.nd.on i{color:var(--ac)}
.pk{position:absolute;z-index:3;transform:translate(-50%,-50%);background:var(--ac);color:#fff;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;opacity:0;pointer-events:none}
:root[data-theme=dark] .pk{color:#13201A}
.pk.go{animation:none}
.flow{position:absolute;inset:44px 16px 16px;display:grid;grid-template-columns:1fr 54px 1fr 54px 1fr;align-items:center}
.fn{background:var(--warm);border:1.5px solid var(--warm-ink);border-radius:16px;padding:16px 6px;text-align:center;opacity:0;transform:translateY(14px) scale(.9);animation:pop .5s forwards}
.fn i{font-size:42px;display:block;color:var(--warm-ink)}
.fn b{font-size:16px;line-height:1.25;display:block;color:var(--warm-ink);font-weight:600}
.fl{position:relative;height:4px;margin:0 4px;background:var(--line);border-radius:2px;opacity:0;animation:fade .3s forwards}
.fl::after{content:"";position:absolute;top:-6px;left:0;width:16px;height:16px;border-radius:50%;background:var(--pk2);animation:pkt 1.6s ease-in-out infinite;animation-delay:inherit}
@keyframes pop{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes pkt{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 16px);opacity:0}}
.flip{animation:flip .5s}
@keyframes flip{from{opacity:0;transform:rotateY(60deg)}to{opacity:1;transform:none}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.card .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft)}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--ac-bg);color:var(--ac);font-weight:600}
.pill.w{background:var(--warm);color:var(--warm-ink)}
.card h2{margin:6px 0 8px;font-size:23px;line-height:1.3}
.card p{margin:0 0 12px}
.idea{background:var(--idea);color:var(--idea-ink);border-radius:12px;padding:12px 16px;display:flex;gap:12px}
.idea i{font-size:26px}
.idea small{display:block;font-family:"JetBrains Mono",monospace;font-size:12px;letter-spacing:.06em;opacity:.85}
.ctrl{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.sdots{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.sdots span{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--soft);font-family:"JetBrains Mono",monospace;cursor:pointer}
.sdots span.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sdots span.dn{background:var(--ac-bg);color:var(--ac);border-color:var(--ac)}
.sdots span.w.on{background:var(--warm-ink);border-color:var(--warm-ink)}
.ldots{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.ldots .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ld{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:6px 12px;font:inherit;font-size:15px;cursor:pointer;display:flex;gap:8px;align-items:center}
.ld .n{font-family:"JetBrains Mono",monospace;color:var(--soft)}
.ld.on{border-color:var(--ac);background:var(--ac-bg);color:var(--ac);font-weight:600}
.hint{font-size:14px;color:var(--soft);margin-top:10px}
kbd{font-family:"JetBrains Mono",monospace;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--bg)}
@media(max-width:980px){.wrap{grid-template-columns:1fr}nav{display:flex;overflow-x:auto;min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav .lv{width:auto;white-space:nowrap}nav .lv .t{display:none}main{grid-template-columns:1fr;padding:14px}.stage{height:340px}.nd{padding:8px 3px}.nd b{font-size:12px!important;overflow-wrap:anywhere}.nd i{font-size:26px}.nd b{font-size:13px}.flow{grid-template-columns:1fr;gap:4px;inset:40px 30px 10px}.fl{width:4px;height:20px;margin:0 auto}.fl::after{display:none}.fn{padding:8px}.fn i{font-size:26px}.crumb h1{font-size:24px}}
</style>
</head>

<script>
const LV=[["Temel","Claude bir klasörde, verdiğin yetkiyle çalışır."],["İş tarif etme","Ne istediğini net söyle, sonucun kanıtını iste."],["Yayına alma","Dalda dene, gördüğünü birleştir, canlıya Cloudflare taşır."],["Ayarlama","Claude'u kendi çalışma biçimine göre kurdun."],["Ajanlar ve ekip","İşi böl, rol ver, onayı kendinde tut."],["Diğer eller","Hangi iş hangi araçta, en az yetkiyle."],["Otomasyon","Başında kimse yokken çalışan iş okur ve raporlar, göndermez."],["Ürün geliştirme","Kendi asistanını yazdın; güvence kodda ve insanda."],["Danışman","Önce süreç, sonra teknoloji; sistem sana bağlı olmasın."]];
const G=LV.map((_,i)=>DERS.filter(d=>d.n.split('.')[0]==String(i+1)));
const $=id=>document.getElementById(id);
let L=0,S=0,P=0,timer=null,lastM=[];
function parseN(d){const o={};d.N.split('|').forEach(s=>{const[k,ic,lb,x,y]=s.split(':');o[k]={ic,lb,x:+x,y:+y}});return o}
function pk(s){if(!s)return null;const i=s.indexOf(':');const[a,b]=s.slice(0,i).split('>');return{a,b,t:s.slice(i+1)}}
function steps(d){return d.S.length+1}
function nav(){$('nav').innerHTML=LV.map((l,i)=>'<button class="lv'+(i===L?' on':'')+'" data-i="'+i+'"><span class="k">'+(i+1)+'</span><span class="t">'+l[0]+'</span></button>').join('');
  [...$('nav').children].forEach(b=>b.onclick=()=>{L=+b.dataset.i;S=0;P=0;draw(true)})}
let built=null;
function build(d){
  const N=parseN(d);built={d,N};
  $('nodes').innerHTML=Object.entries(N).map(([k,n])=>'<div class="nd" id="nd-'+k+'" style="left:clamp(var(--hw),'+n.x+'%,calc(100% - var(--hw)));top:'+n.y+'%"><i class="ti ti-'+n.ic+'"></i><b>'+n.lb+'</b></div>').join('');
  const pairs=new Set();d.S.forEach(s=>{const p=pk(s[1]);if(p)pairs.add([p.a,p.b].sort().join('-'))});
  $('ln').innerHTML=[...pairs].map(pr=>{const[a,b]=pr.split('-');return '<line data-a="'+a+'" data-b="'+b+'" x1="'+N[a].x+'%" y1="'+N[a].y+'%" x2="'+N[b].x+'%" y2="'+N[b].y+'%" style="opacity:0"/>'}).join('');
  lastM=[];
}
function anim(p){
  clearInterval(timer);const el=$('pk');el.style.transition='none';el.style.opacity=0;
  if(!p)return;const N=built.N;if(!N[p.a]||!N[p.b])return;
  el.textContent=p.t;
  const run=()=>{el.style.transition='none';el.style.left=N[p.a].x+'%';el.style.top=N[p.a].y+'%';el.style.opacity=0;void el.offsetWidth;
    el.style.transition='left 1.3s ease-in-out, top 1.3s ease-in-out, opacity .25s';el.style.opacity=1;el.style.left=N[p.b].x+'%';el.style.top=N[p.b].y+'%';
    setTimeout(()=>{el.style.opacity=0},1500)};
  setTimeout(run,350);timer=setInterval(run,2600);
}
function draw(newLesson){
  const d=G[L][S];if(newLesson||!built||built.d!==d)build(d);
  nav();
  const last=P===d.S.length;
  $('where').textContent='SEVİYE '+(L+1)+' · '+LV[L][0].toUpperCase()+' / DERS '+d.n;
  $('title').textContent=d.t;$('oz').textContent=d.oz;$('lsum').textContent=LV[L][1];$('bz').textContent=d.bz;
  // metrics
  if(d.M){const lab=d.M.split('|');let vals=lab.map(()=>'?');for(let i=0;i<=Math.min(P,d.S.length-1);i++){if(d.S[i][2])vals=d.S[i][2].split('|')}
    $('mets').style.display='grid';$('mets').innerHTML=lab.map((l,i)=>'<div class="met"><small>'+l+'</small><b class="'+(lastM[i]!==undefined&&lastM[i]!==vals[i]&&vals[i]!=='?'?'new':'')+'">'+vals[i]+'</b></div>').join('');lastM=vals}
  else{$('mets').style.display='none'}
  const st=$('stage');
  if(!last){
    $('flowbox')&&$('flowbox').remove();
    $('nodes').style.display='';$('ln').style.display='';
    $('shd').innerHTML='<i class="ti ti-robot" style="color:var(--ac)"></i> CLAUDE TARAFINDA';
    const vis=new Set();for(let i=0;i<=P;i++){d.S[i][0].split(',').forEach(k=>vis.add(k));const p=pk(d.S[i][1]);if(p){vis.add(p.a);vis.add(p.b)}}
    const on=new Set(d.S[P][0].split(','));const p=pk(d.S[P][1]);if(p){on.add(p.a);on.add(p.b)}
    Object.keys(built.N).forEach(k=>{const e=$('nd-'+k);e.className='nd'+(vis.has(k)?' vis':'')+(on.has(k)?' on':'')});
    [...$('ln').children].forEach(l=>l.style.opacity=vis.has(l.dataset.a)&&vis.has(l.dataset.b)?1:0);
    anim(p);
    $('sno').textContent='ADIM '+(P+1)+' / '+steps(d);$('pill').textContent='KAVRAM';$('pill').className='pill';
    $('sh').textContent=d.S[P][4]||(P===0?'Ne oluyor?':'Sonra');
    $('stx').textContent=d.S[P][3];
  }else{
    anim(null);$('nodes').style.display='none';$('ln').style.display='none';
    $('shd').innerHTML='<i class="ti ti-building-factory" style="color:var(--warm-ink)"></i> SENİN DÜNYANDA';
    let fb=$('flowbox');if(fb)fb.remove();fb=document.createElement('div');fb.id='flowbox';fb.className='flow flip';
    const parts=d.W.split('|');fb.innerHTML=parts.map((x,i)=>{const j=x.indexOf(':');return '<div class="fn" style="animation-delay:'+(i*0.7)+'s"><i class="ti ti-'+x.slice(0,j)+'"></i><b>'+x.slice(j+1)+'</b></div>'+(i<parts.length-1?'<div class="fl" style="animation-delay:'+(i*0.7+0.4)+'s"></div>':'')}).join('');
    st.appendChild(fb);
    $('sno').textContent='ADIM '+(P+1)+' / '+steps(d);$('pill').textContent='BENZETME';$('pill').className='pill w';
    $('sh').textContent='Bildiğin dünyada neye benzer?';$('stx').textContent='Aynı fikir, senin yıllardır yaptığın işte:';
  }
  const end=L===G.length-1&&S===G[L].length-1&&last;
  $('fwd').innerHTML=end?'Baştan <i class="ti ti-refresh"></i>':(last?'Sonraki ders':'İleri')+' <i class="ti ti-arrow-right"></i>';
  $('sdots').innerHTML=Array.from({length:steps(d)},(_,i)=>'<span class="'+(i===P?'on':i<P?'dn':'')+(i===d.S.length?' w':'')+'" data-i="'+i+'">'+(i===d.S.length?'<i class="ti ti-bulb" style="font-size:14px"></i>':i+1)+'</span>').join('');
  [...$('sdots').children].forEach(x=>x.onclick=()=>{P=+x.dataset.i;draw()});
  $('ldots').innerHTML=G[L].map((x,i)=>'<button class="ld'+(i===S?' on':'')+'" data-i="'+i+'"><span class="n">'+x.n+'</span>'+x.t+'</button>').join('');
  [...$('ldots').children].forEach(x=>x.onclick=()=>{S=+x.dataset.i;P=0;draw(true)});
  try{localStorage.setItem('gorsel-yer',JSON.stringify([L,S,P]))}catch(e){}
}
function fwd(){const d=G[L][S];if(P<d.S.length)P++;else if(S<G[L].length-1){S++;P=0}else if(L<G.length-1){L++;S=0;P=0}else{L=0;S=0;P=0}draw()}
function back(){if(P>0)P--;else if(S>0){S--;P=G[L][S].S.length}else if(L>0){L--;S=G[L].length-1;P=G[L][S].S.length}draw()}
$('fwd').onclick=fwd;$('back').onclick=back;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')fwd();if(e.key==='ArrowLeft')back()});
const r=document.documentElement;function th(dk){r.dataset.theme=dk?'dark':'light';$('theme').innerHTML='<i class="ti ti-'+(dk?'sun':'moon')+'"></i>'}
th(matchMedia('(prefers-color-scheme: dark)').matches);$('theme').onclick=()=>th(r.dataset.theme!=='dark');
try{const s=JSON.parse(localStorage.getItem('gorsel-yer'));if(s&&G[s[0]]&&G[s[0]][s[1]]){L=s[0];S=s[1];P=Math.min(s[2],G[L][S].S.length)}}catch(e){}
draw(true);
</script>
</body>
</html>
